name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Static Analysis Gate (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gate tools (versions resolve from pyproject config)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy "pillow>=9.0"

      - name: Static Analysis Gate (same script as local dev)
        run: bash scripts/lint.sh

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system fonts (parity with production Ubuntu renderers)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=9.0"

      - name: py_compile every shipped module
        run: |
          python -m py_compile ak820_ctrl.py milestone_radar.py widgets.py
          python -m py_compile ak820/*.py
          python -m py_compile tests/*.py

      - name: Unit tests (device-free suite, FakeTransport simulator)
        run: python -m unittest discover -s tests -v
