[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ak820pro-linux"
version = "0.20.0"
description = "Native Linux CLI tool to control the 128x128 TFT screen, animated GIFs, RGB backlighting, and RTC clock on Ajazz AK820 Pro"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ervin Urban" }
]
keywords = [
    "ajazz",
    "ak820pro",
    "mechanical-keyboard",
    "linux",
    "hidraw",
    "tft-display",
    "reverse-engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/ErvinUrban-Bratislava/ak820pro-linux"
Repository = "https://github.com/ErvinUrban-Bratislava/ak820pro-linux.git"
Issues = "https://github.com/ErvinUrban-Bratislava/ak820pro-linux/issues"

[project.scripts]
ak820 = "ak820.cli:main"
ak820-ctrl = "ak820.cli:main"

[tool.setuptools]
py-modules = ["ak820_ctrl", "milestone_radar", "widgets"]
packages = ["ak820"]
