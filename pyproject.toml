[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ak820pro-linux"
version = "0.30.0"
description = "Native Linux CLI tool to control the 128x128 TFT screen, animated GIFs, RGB backlighting, and RTC clock on Ajazz AK820 Pro"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ervin Urban" }
]
keywords = [
    "ajazz",
    "ak820pro",
    "mechanical-keyboard",
    "linux",
    "hidraw",
    "tft-display",
    "reverse-engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/ErvinUrban-Bratislava/ak820pro-linux"
Repository = "https://github.com/ErvinUrban-Bratislava/ak820pro-linux.git"
Issues = "https://github.com/ErvinUrban-Bratislava/ak820pro-linux/issues"

# --- Static Analysis Gate baseline (v0.22.0, REVIEW.md §14.2 / ITERATIONS v0.22) ---
# Single source of truth: local `scripts/lint.sh` and the CI `lint` job both read
# these sections, so local and CI can never drift apart. Behavior-neutral only.
[tool.ruff]
line-length = 100
target-version = "py310"  # mirrors requires-python >= 3.10

[tool.ruff.lint]
# Curated rule families: pyflakes + isort + pyupgrade + bandit-lite + a few
# readability families. Every finding in ak820/ + ak820_ctrl.py is fixed or
# justified inline (noqa with reason), never blanket-ignored.
select = ["E4", "E7", "E9", "F", "I", "UP", "S", "BLE", "PIE", "PLW", "RUF", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["ak820"]
mypy_path = "."          # root shims (milestone_radar, widgets) resolve for typing
follow_imports = "silent"  # gate reports ak820/ only; followed modules supply types

# numpy is an *optional* accelerator (§4.4): CI never installs it, so the
# guarded `import numpy as _np` in screen.py must not fail the gate there.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[project.scripts]
ak820 = "ak820.cli:main"
ak820-ctrl = "ak820.cli:main"

[tool.setuptools]
py-modules = ["ak820_ctrl", "milestone_radar", "widgets"]
packages = ["ak820"]
